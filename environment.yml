# Ambiente Conda do projeto (Aula 2 de Ambientes)
# Criar:   conda env create -f environment.yml
# Ativar:  conda activate case-nps
name: case-nps
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pandas=2.3.1
  - numpy=2.3.5
  - scipy=1.16.3
  - statsmodels=0.14.5
  - scikit-learn=1.7.2
  - matplotlib=3.10.6
  - seaborn=0.13.2
  - joblib=1.5.2
  - jupyterlab
  - nbconvert
  - black=25.9.0
  - flake8=7.1.1
  - pre-commit
